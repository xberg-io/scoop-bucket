# AI-Rulez Configuration (migrated to V4 TOML format)
# Documentation: https://github.com/Goldziher/ai-rulez

version = "5.0"
name = 'scoop-bucket'
description = 'Scoop bucket with app manifests for xberg-io CLI tools'
gitignore = true
presets = ["claude", "codex", "copilot", "cursor", "antigravity", "opencode", "pi"]
builtins = ['default-commands']

compact = true
[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
path = 'modules/core'
merge_strategy = 'local-override'

# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
[header]
hashes = "full"
