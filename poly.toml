required_version = ">=0.36.0"

# Mirrors xberg-io/homebrew-tap's poly.toml, minus the Ruby tooling (no formulae here)
# and minus its Formula/** lint exclusions. bucket/*.json is deliberately NOT excluded:
# manifests are plain JSON with no vendor DSL, so they format like everything else.

[per_file_ignores]
# GitHub renders this file as the PR body, where a level-1 heading would sit above the
# author's text as a title the PR does not have. Its first heading is deliberately "##".
".github/PULL_REQUEST_TEMPLATE.md" = ["MD041"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
lint = { exclude = ["**/*.lock", "/.ai-rulez/.generated-manifest.json"] }
fmt = { exclude = ["**/*.lock", "/.ai-rulez/.generated-manifest.json"] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = ["**/*.lock", "/.ai-rulez/.generated-manifest.json"] }

# --- catalog tools (standalone binaries, PATH-probed) ---
[tools.shfmt]
enabled = true

[tools.actionlint]
enabled = true

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v5"
hooks = ["ai-rulez-validate"]

[discovery]
exclude = ["/.ai-rulez/.generated-manifest.json", "/.mcp.json"]

[engines.typos]
# typos is opt-in in poly v2; this keeps the v1 default (on).
enabled = true

[engines.harper]
enabled = true
# Off: rules that contradict the org's sentence-case headings and no-Oxford-comma style, or misread technical prose
# (denylist, MB, stdin). ~keep
ignore = [
  "UseTitleCase",
  "OxfordComma",
  "SplitWords",
  "OrthographicConsistency",
  "ExpandMemoryShorthands",
  "ExpandStandardInputAndOutput",
  "ExpandConfiguration",
  "ExpandMinimum",
]
